_meta:
  type: "roles"
  config_version: 2

# The web app: search, count, get and point-in-time reads on the five aliases
# and the versioned indexes behind them. No writes, no index or cluster admin.
bgc_reader:
  cluster_permissions:
    - "cluster_composite_ops_ro"
    - "indices:data/read/point_in_time/delete"
  index_permissions:
    - index_patterns:
        - "bgc_facets*"
        - "bgc_facet_vocab*"
        - "bgc_browse*"
        - "gcf_browse*"
        - "sample_browse*"
      allowed_actions:
        - "read"
        - "indices:data/read/point_in_time/create"

# Index builds: create versioned indexes, bulk-load, scroll, swap aliases and
# drop superseded versions -- on the atlas index patterns only.
bgc_indexer:
  cluster_permissions:
    - "cluster_composite_ops"
    - "cluster_monitor"
  index_permissions:
    - index_patterns:
        - "bgc_facets*"
        - "bgc_facet_vocab*"
        - "bgc_browse*"
        - "gcf_browse*"
        - "sample_browse*"
      allowed_actions:
        - "indices_all"
    # Alias lookups (`GET _alias/<name>`, `_cat/aliases`) resolve against every
    # index, so reading alias metadata needs this one action cluster-wide. It
    # exposes alias names only.
    - index_patterns:
        - "*"
      allowed_actions:
        - "indices:admin/aliases/get"
